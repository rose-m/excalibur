{{- $root := . }}
{{- if and (or .Values.auth.remoteSecretName .Values.database.remoteSecretName) (eq (include "excalibur.authSecret" .) (include "excalibur.databaseSecret" .)) }}
{{- fail "Auth and database must use different Kubernetes Secret names when using External Secrets" }}
{{- end }}
{{- range $component, $source := dict "auth" .Values.auth "database" .Values.database }}
{{- if $source.remoteSecretName }}
{{- if not (has $root.Values.externalSecrets.secretStoreRef.kind (list "SecretStore" "ClusterSecretStore")) }}
{{- fail "externalSecrets.secretStoreRef.kind must be SecretStore or ClusterSecretStore" }}
{{- end }}
{{- $target := include "excalibur.databaseSecret" $root }}
{{- $keys := list $root.Values.database.passwordKey }}
{{- if eq $component "auth" }}
  {{- $target = include "excalibur.authSecret" $root }}
  {{- $keys = list $source.apiKeyKey }}
  {{- if $source.mcp.enabled }}
    {{- $keys = append $keys $source.mcp.clientIdKey }}
    {{- $keys = append $keys $source.mcp.clientSecretKey }}
  {{- end }}
{{- else if $source.password }}
  {{- fail "database.remoteSecretName and database.password cannot both be set" }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "excalibur.name" $root }}-{{ $component }}
  labels:
    {{- include "excalibur.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required" $root.Values.externalSecrets.secretStoreRef.name | quote }}
    kind: {{ $root.Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ $target | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $keys }}
    - secretKey: {{ . | quote }}
      remoteRef:
        key: {{ $source.remoteSecretName | quote }}
        property: {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
