{{- if and (not .Values.database.existingSecret) (not .Values.database.remoteSecretName) }}
{{- $name := include "excalibur.databaseSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.database.password }}
{{- if not $password }}
  {{- if $existing }}
    {{- $password = required "Existing database Secret is missing database.passwordKey" (index $existing.data .Values.database.passwordKey) | b64dec }}
  {{- else if not .Values.postgresql.enabled }}
    {{- fail "External Postgres requires database.existingSecret, database.remoteSecretName, or database.password" }}
  {{- else }}
    {{- $password = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "excalibur.labels" . | nindent 4 }}
  annotations:
    # Preserve credentials alongside retained StatefulSet PVCs on uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.database.passwordKey | quote }}: {{ $password | b64enc | quote }}
{{- end }}
