apiVersion: v1
kind: Service
metadata:
  name: {{ include "excalibur.name" . }}
  labels:
    {{- include "excalibur.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "excalibur.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
