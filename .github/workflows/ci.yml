name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: excalibur_test
          POSTGRES_USER: excalibur
          POSTGRES_PASSWORD: excalibur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U excalibur -d excalibur_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://excalibur:excalibur@localhost:5432/excalibur_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  helm:
    name: Helm lint and render tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - run: python -m pip install PyYAML==6.0.2
      - run: helm lint charts/excalibur --strict
      - run: python scripts/test-helm.py

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
